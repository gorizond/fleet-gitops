gitrepos:
  # fleet-local
  - name: fleet-cert-manager
    description: TLS + letsencrypt
    namespace: fleet-local
  - name: fleet-workspace-controller
    description: Split fleet workspaces per users with roles
    namespace: fleet-local
    paths:
      - charts/fleet-workspace-controller
  - name: fleet-gorizond-cluster
    repo: gorizond-cluster
    description: k3s/headscale api saas
    namespace: fleet-local
    paths:
      - charts
  - name: fleet-gorizond-pay-yookassa
    repo: yookassa-url-generator
    description: yookassa integrate with gorizond
    namespace: fleet-local
    paths:
      - charts
  - name: docusaurus
    description: Documentaion + Blog
    namespace: fleet-local
    clientSecretName: auth-rnmxl
    repo_domain: https://gitlab.com
    repo_path: gorizond/gitops
    imageScanCommit:
      authorEmail: i@negash.ru
      authorName: Fleet Bot
      messageTemplate: 'chore(fleet): ImageScan update image'
    imageScanInterval: 15s
  - name: jspolicy-for-autoscaler
    description: Generate autoscaler for all clusters
    namespace: fleet-local
    paths:
      - policy
  - name: fleet-clusters
    description: Gorizond clusters (data + runtime)
    namespace: fleet-local
  # fleet-default
  - name: fleet-cert-manager
    description: TLS + letsencrypt
  - name: fleet-gorizond-database
    description: Databases for gorizond k3s/headscale saas
helmrepos:
  # fleet-local
  - name: jspolicy
    description: JS mutator/validator k8s
    namespace: fleet-local
    helm:
      releaseName: jspolicy
      repo: https://charts.loft.sh
      chart: jspolicy
      values:
        replicaCount: 1
  - name: d7y-cattle-operator
    description: Dragonfly P2P operator on the local management cluster (manager-only canary)
    namespace: fleet-local
    targetNamespace: d7y-system
    helm:
      releaseName: d7y-cattle-operator
      repo: https://raw.githubusercontent.com/gorizond/d7y-cattle-operator/gh-pages
      chart: d7y-cattle-operator
      version: 0.1.34
      values:
        webhook:
          enabled: false
        image:
          repository: ghcr.io/gorizond/d7y-cattle-operator
          tag: v0.1.34
        # manager.apiURL also becomes extras.ingress.rest.host.
        manager:
          grpcDomain: manager-grpc.koldun.negash.ru
          apiURL: https://manager-api.koldun.negash.ru
        # Required by operator config; unused by the manager-only canary.
        nginx:
          staticURL: https://static.koldun.negash.ru
        # Secret in d7y-system with username/password for the manager API.
        managerApiCredentialsSecret: dragonfly-manager-api
        extras:
          chart:
            repo: https://raw.githubusercontent.com/gorizond/d7y-cattle-operator/gh-pages
            version: 0.1.8
          ingress:
            controller: traefik
            className: traefik
            grpcEnabled: false
            restEnabled: true
            tlsSecret: dragonfly-p2p-mtls
            traefikServersTransportEnabled: true
  # fleet-default
  - name: longhorn
    description: Cloud native distributed block storage for Kubernetes
    defaultNamespace: longhorn-system
    helm:
      releaseName: longhorn
      repo: https://charts.longhorn.io
      chart: longhorn
      version: 1.11.0
      values:
        defaultSettings:
          kubernetesClusterAutoscalerEnabled: true
